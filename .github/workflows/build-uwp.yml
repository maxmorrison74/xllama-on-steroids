name: Build UWP (Windows)

on:
  push:
    branches: [ feat/moe-xbox-smoke-probe ]
  workflow_dispatch:

jobs:
  build-uwp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        # xllama UWP packaging requires MSVC + Windows SDK (UWP workload).
        # The github.com/microsoft/vswhere tool is included with Visual Studio.

      - name: Verify MSVC and locate build tools
        shell: pwsh
        run: |
          $msbuild = vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\MSBuild.exe
          if (-not $msbuild) { throw "MSBuild not found" }
          Write-Host "MSBuild: $msbuild"
          $cl = vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe
          if (-not $cl) { throw "cl.exe not found" }
          Write-Host "cl.exe: $cl"

      - name: Check UWP workload availability
        shell: pwsh
        run: |
          # The UWP workload (Microsoft.VisualStudio.Component.Windows10SDK.22621.UWP
          # / Microsoft.VisualStudio.ComponentGroup.UWP.All) is not guaranteed on
          # github.com/microsoft/vswhere-hosted Windows runners. If missing, this
          # step fails with a clear message rather than a cryptic CMake error.
          $vs = vswhere -latest -products *
          Write-Host "VS instance: $($vs.installationPath)"
          $uwp = vswhere -latest -requires Microsoft.ComponentGroup.UWP.All
          if (-not $uwp) {
            Write-Host "WARNING: UWP workload not detected on this runner."
            Write-Host "Install it once with:"
            Write-Host "  vs_installer.exe --add Microsoft.VisualStudio.ComponentGroup.UWP.All --add Microsoft.VisualStudio.Component.Windows10SDK.22621.UWP --norestart --quiet"
            Write-Host "Then re-run this workflow."
            exit 1
          }
          Write-Host "UWP workload present."

      - name: Configure and build UWP (llamacpp backend)
        shell: pwsh
        run: |
          # xllama does not support cmake -DXLLAMA_TARGET=uwp directly;
          # UWP packaging requires MSVC and the Windows SDK via build-uwp.ps1.
          .\scripts\build-uwp.ps1 -Configuration Release -Platform x64 -Backend llamacpp

      - name: List produced packages
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.msix | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xllama-uwp-release
          path: |
            **/*.msix
            **/*.appx
          retention-days: 14
